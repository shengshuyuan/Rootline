<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Rootline desktop family tree workspace reference</title>
  <desc id="desc">A warm-white three-column desktop interface with toolbar, family overview, relationship canvas, and person detail panel.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EDE7DD" stroke-width="1"/></pattern>
