      .tiny { font-family: Inter, 'Noto Sans SC', Arial, sans-serif; font-size:11px; fill:#6F6A62 }
      .label { font-family: Inter, 'Noto Sans SC', Arial, sans-serif; font-size:12px; font-weight:600; fill:#1C1B18 }
      .name { font-family: Inter, 'Noto Sans SC', Arial, sans-serif; font-size:15px; font-weight:700; fill:#1C1B18 }
    </style>
